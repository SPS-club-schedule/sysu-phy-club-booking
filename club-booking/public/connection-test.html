<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>预约网站连接测试</title><style>body{font:17px/1.7 system-ui,sans-serif;max-width:620px;margin:48px auto;padding:0 22px;color:#183c31;background:#f5faf7}button{font:inherit;background:#16764d;color:white;border:0;border-radius:10px;padding:12px 24px;cursor:pointer}#result{padding:20px;border:1px solid #bfd8cb;border-radius:12px;overflow-wrap:anywhere}small{color:#52645c}</style></head><body><h1>预约网站连接测试</h1><p>请关闭代理，用校园网或手机流量打开此页面。</p><p id="result" role="status" aria-live="polite">准备测试……</p><button id="retry">重新测试</button><p><small>此页面只检查接口连接，不读取或修改预约。正式预约网站已使用 Cloudflare 后端。</small></p><p><a href="./">返回预约网站</a></p><script>
const button=document.getElementById('retry');const result=document.getElementById('result');
async function check(){button.disabled=true;result.textContent='正在连接Cloudflare 接口……';const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);const started=performance.now();try{const response=await fetch('https://sysu-phy-club-book.folderrewind.top/api/health',{signal:controller.signal,cache:'no-store',credentials:'omit'});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();if(data.ok!==true||data.service!=='club-booking-connectivity')throw new Error('接口返回内容异常');result.textContent='连接成功 ✓ 网页已正常连接 Cloudflare 接口，用时 '+Math.round(performance.now()-started)+' 毫秒。';}catch(error){result.textContent='连接失败：'+(error.name==='AbortError'?'请求超过 15 秒':error.message)+'。请告知使用的网络。';}finally{clearTimeout(timer);button.disabled=false;}}
button.addEventListener('click',check);check();
</script></body></html>
