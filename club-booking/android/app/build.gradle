plugins { id 'com.android.application' }

def signingFile = rootProject.file(System.getenv('BOOKING_ANDROID_SIGNING_PROPERTIES') ?: 'signing.properties')
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'org.spsclub.booking'
    compileSdk 36
    defaultConfig {
        applicationId 'org.spsclub.booking'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        if (signingFile.exists()) {
            release {
                storeFile file(signing['storeFile'])
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (signingFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    lint { abortOnError true }
}

// Rebuild the actual React/CSS bundle even when building from Android Studio.
def bundleWeb = tasks.register('bundleWeb', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'scripts/export-android.mjs'
    inputs.files(fileTree('../../app'), fileTree('../../online'), file('../../scripts/export-android.mjs'), file('../../public/favicon.svg'), file('../../package-lock.json'))
    outputs.dir('src/main/assets/www')
}
tasks.named('preBuild').configure { dependsOn bundleWeb }

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
